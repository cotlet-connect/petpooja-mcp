[project]
name = "petpooja-mcp"
version = "1.1.0"
description = "Connect Petpooja to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Petpooja API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["petpooja", "petpooja api", "petpooja mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/petpooja-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=petpooja"
Source = "https://github.com/cotlet-connect/petpooja-mcp"

[project.scripts]
petpooja-mcp = "petpooja_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"petpooja_agent.py" = "petpooja_agent.py"

[tool.hatch.build.targets.sdist]
include = ["petpooja_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
